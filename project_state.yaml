known_issues:
  - "CSP in next.config.ts uses 'unsafe-inline' for script-src to keep marketing pages statically rendered. Tighten to nonce + strict-dynamic on dynamic routes in Phase 9. See node_modules/next/dist/docs/**/content-security-policy.md."
  - "Home page renders lib/placeholder-catalogue.ts behind a visible 'preview build' notice. Prices are illustrative and MUST NOT ship publicly — Phase 3 deletes that module."
  - "components/brand/logo.tsx is an SVG placeholder pending the owner's real logo files."
  - "Legal pages are substantive drafts carrying visible 'Draft — needs owner review' banners and inline TODO(owner) markers. Section 21 gates go-live on these being resolved."

blockers:
  - "DATABASE_URL: real MongoDB Atlas connection string not yet provided by owner."
  - "PayFast: no merchant sandbox credentials yet, and hosted-checkout field-level docs still needed from the PayFast dashboard/account manager. Phase 5 cannot start without both."
  - "Hostinger plan type (VPS vs Node.js shared hosting) unknown — determines the Phase 11 deploy method. Not blocking until Phase 11."
  - "Brand assets: owner has dark/light logos as JPG. Need PNG/SVG with transparency before final polish. Not a launch blocker."

external_integrations:
  smileone:
    status: "not-started"
    env: "sandbox credentials available in brief, untested"
    last_tested: null
  payfast:
    status: "blocked-on-credentials"
    last_tested: null

decisions:
  architecture: "Single Next.js app (confirmed by owner) — no separate Express service."
  admin_auth: "Auth.js / NextAuth (confirmed by owner)."
  customer_accounts: "None in v1 — guest checkout + order lookup by order ID + email/phone (confirmed by owner)."
  hosting: "Vercel for preview/testing only; production on Hostinger (owner decision, 2026-08-15). No Vercel-only primitives anywhere in the codebase."
  payfast_mode: "Hosted/redirect checkout recommended to stay out of PCI-DSS scope. NOT yet confirmed with owner against live merchant dashboard."

