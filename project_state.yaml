known_issues:
  - |
    THE TEST SUITE COVERS PURE LOGIC ONLY — a green `npm test` is not a covered
    codebase. Nothing in tests/ touches MongoDB and nothing reaches the network.
    Still verified by hand, or not at all: createPendingOrder,
    findOrderForGuest, verifyAndSettleOrder, the fulfilment executor, the
    sweeper, rate limiting, admin auth, and every route handler. In particular
    the ATOMIC CONDITIONAL UPDATES that rules 3 and 8 rest on are a property of
    MongoDB and the query — they cannot be asserted without a live connection,
    so they remain unproven by anything automatic. tests/README.md has the
    full list. Do not cite the test count as evidence about those paths.
  - |
    NO TYPESCRIPT PARAMETER PROPERTIES in any module a test imports. Node's
    strip-only TypeScript mode cannot parse `constructor(readonly x: string)`,
    and the whole file fails to load — not the class, the file. safety.ts had
    already adopted plain field declarations for this reason; smileone/client.ts
    was converted on 2026-09-04 when it turned out to be untestable.
    lib/services/payfast/client.ts still uses them and will need the same
    treatment the day it gets a test.
  - |
    ⛔ LIVE SMILEONE ACCOUNT — NOT A DEV SANDBOX. There is no sandbox; the only
    working host is production. Every request is against the owner's real
    account holding real purchased diamonds, and a delivery is irreversible.
    Permitted: productlist, getrole (both read-only, spend nothing).
    Forbidden: createorder or anything else that delivers — no test deliveries,
    not even the cheapest pack, not with the owner's own player ID.
    Enforced by lib/services/smileone/safety.ts. Do not remove that gate and do
    not set SMILEONE_ALLOW_FULFILMENT. Full rules in LIVE_ACCOUNT_SAFETY.md.
  - |
    RESOLVED 2026-08-18 — the Vercel variables were all present, correctly
    targeted, and all EMPTY (pasted from .env.example, not .env.local). Re-set
    from .env.local with `vercel env add --value --force`; the build then
    prerendered / from Atlas and went green. Kept because the symptom is
    misleading: requireEnv reports an empty string as "Missing", which reads
    like an absent variable. If it recurs, print key names and set/EMPTY/ABSENT
    from next.config.ts — it runs on Vercel and settles it in one deploy.
    Historical: the project ecs3/games-central had
    SMILEONE_ALLOW_FULFILMENT set on Production AND Preview. Vercel marks it
    Sensitive, so the value cannot be read back through the API or the CLI;
    safety.ts opens the gate on the exact string "1". It must not exist on any
    environment. Also set there and equally wrong: BUILD_STANDALONE (the
    Hostinger-only build switch) and SMILEONE_STUB (throws by design on a
    production build). Awaiting the owner before anything is removed.
  - |
    RESOLVED 2026-08-16 (rate limiting) — kept because the tuning is a
    judgement call someone will want to revisit. /api/checkout/verify-account
    is limited on two axes: 12 per IP per 10 min, and 60 globally per minute.
    The global rule is the one that actually protects the merchant account,
    because x-forwarded-for is spoofable and the failure being prevented
    (SmileOne throttling us) does not care how many machines the flood came
    from. Its cost is that an attacker tripping it makes real customers wait —
    accepted deliberately: a minute of "try again" ends by itself, a suspended
    merchant account needs a phone call. Raise LOOKUP_GLOBAL in
    lib/services/rate-limit.ts if real traffic ever approaches 1/second.
  - |
    getrole's `zone` is NOT the Zone ID that was sent — a lookup on zone 16932
    returned `zone: 1`. Meaning still unknown. The checkout UI shows the
    customer's typed Zone ID, not this, and it must stay that way. Do not
    "fix" the UI to display role.zone.
    It is now the leading CANDIDATE for a region marker (see the region-gate
    entry below): a small integer that ignores our input is the shape a
    server-group index would take. One account is not enough to tell — that is
    a hypothesis, not a finding.
  - |
    RESOLVED 2026-08-28 — getrole's `change_price` IS A MULTIPLIER, NOT A
    PRICE. The live baseline returns top-level `change_price: 1` alongside an
    `id_change_price_info` array whose entries are also 1 (except product 25 at
    1.0043). No diamond pack costs 1 BRL, so 1 cannot be a price; both fields
    are scaling factors applied to the productlist price.
    This corrects the wording in CLAUDE.md ("source of truth for the final
    charge"), which reads as though change_price replaces the catalogue price.
    Phase 6 must MULTIPLY, not substitute. Substituting would charge 1 BRL.
    Still open: which of the two fields wins when they disagree, and why
    id_change_price_info lists 11 products when productlist returns 16 —
    including product_id 20340 and 16642, which are in neither. The catalogue
    mapping is still not settled.
  - |
    REGION GATE — RESOLVED 2026-08-28. THE SUPPLIER DOES THE COUNTRY CHECK.
    getrole answers HTTP 200 + status 201 for a restricted account, verbatim:
    "According to the request of the mlbb team, we do not support recharge for
    users in Indonesia, Malaysia, the Philippines, Singapore, and Russia for
    the time being."
    Confirmed live against a real Philippine account (302375851/3596) beside
    the owner's own (1638539586/16932), which answered normally. The five are
    exactly the five the owner named.
    So there is NO zone-to-country table in this codebase and there must never
    be one. MLBB Zone IDs do not encode country — players from different
    countries share zones, and the "server ID to country" lists on forums are
    guesswork. We do not need them: Moonton's own restriction reaches us
    through status 201, before any money moves, for free.
    Handled in lib/services/smileone/client.ts (SmileOneRegionBlockedError) ->
    verify-account (RegionNotServedError) -> controller (403, polite text, no
    field flagged, upstream wording logged not forwarded).
    Do not "improve" this by parsing the country names out of the message. It
    says "for the time being" — the list is Moonton's to change, and the status
    code is the stable part.
  - |
    REGION COST GATE — lib/services/region-policy.ts, live since 2026-08-28.
    Separate concern from the country block above, and NOT a duplicate of it.
    It catches the account the supplier IS willing to serve but at a price
    above what our catalogue assumes: refuse when getrole's multiplier exceeds
    MAX_SUPPLIER_MULTIPLIER (1.05).
    Baseline for calibration, owner's own account: change_price=1, per-product
    multipliers all 1 except product 25 at 1.0043.
    UNPROVEN IN THE FIELD — no account has ever come back above 1.0043, so the
    refusal branch has only ever been exercised by the logic checks. If a real
    Pakistani customer is ever refused by it, the observed multiplier is in the
    [region] log line; raise the constant rather than removing the gate.
  - |
    RESOLVED 2026-08-28 — the create-order bypass is closed, on the owner's
    explicit go-ahead. createPendingOrder now re-runs verifyGameAccount before
    writing the order, so the region block and getrole's mistyped-ID safety net
    cannot be skipped by posting straight to /api/checkout/create-order.
    confirmedUsername and supplierChangePrice are no longer taken from the
    request body — the order records the server's own lookup. The client still
    sends confirmedUsername, used only to log a disagreement; it is not stored.
    ACCEPTED COST, the owner was told and agreed: order creation now depends on
    SmileOne being reachable. Supplier downtime blocks new sales instead of
    merely delaying delivery. Reverting this re-opens the bypass — do not do it
    quietly to "make checkout more resilient".
    orderCreateRules now also consumes the SHARED lookup:global bucket, because
    order creation reaches the merchant account too and both of its own rules
    are keyed on caller-controlled values.
  - |
    getrole HAS TWO NOT-FOUND CODES, and only one was handled until 2026-08-28.
    20003 "USER ID ou Zone ID não existe" and 20004 "USER ID não existe".
    20004 was unmapped and fell through to the generic failure path, so a
    mistyped Player ID told the customer "we can't reach the game servers,
    try again shortly" — a permanent no dressed as a transient outage. Both now
    map to AccountNotFoundError.
    ⚠️ DO NOT TRUST 20004's MESSAGE. It names the USER ID, but the owner's own
    VALID Player ID with a wrong Zone ID (1638539586/9999) returns 20004 as
    well. Narrowing the error to the Player ID on that wording was tried and
    reverted the same day: it told a customer whose Player ID was correct to go
    and check their Player ID. Both fields stay flagged.
  - |
    RESOLVED AS A DECISION 2026-08-18, not deferred again — do not re-open
    without a new reason. script-src keeps 'unsafe-inline'. The only
    dangerouslySetInnerHTML in the codebase is the pre-paint theme script and
    its content is a compile-time constant; React escapes everything else, so
    there is no injection sink for a nonce to defend. A nonce is per-request
    and that script lives in the shared root layout, so adopting one forces the
    marketing and legal pages dynamic and gives up their static rendering — a
    real cost against a hypothetical benefit. Revisit only if a genuine HTML
    sink is introduced.
  - |
    form-action MUST list PayFast and is baked at BUILD time. The checkout
    handoff is a real cross-origin form POST (submitToGateway in
    checkout-form.tsx), so 'self' alone makes the browser refuse it — the
    customer clicks Pay and nothing happens, with the reason only in the
    console. next.config.ts lists both hosts plus any PAYFAST_API_BASE_URL
