    stock: "344 Diamonds" is 2× 172, "600" is 86 + 2× 257. All 26 SKUs now map
    (npm run catalogue:verify).
    The mapping was cross-checked against the owner's OWN PRICES, which turn
    out to be set at a near-constant ~60 PKR per BRL of supplier cost across
    the whole catalogue (86 dia: 380/6.25 = 60.8; 9288: 37700/625 = 60.3).
    That rate identifies which pack a product was priced from — it is what
    confirmed the two combos use the 165 and 55 packs (1,150 PKR ≈ 19.99 BRL)
    and the Double Diamonds use the flat 55/165/275/565 packs. If a future
    price looks wrong, this rate is the check.
  - |
    RESOLVED 2026-08-18 — kept because the underlying fact has not changed and
    the wording must not be "tidied up" back into a bare claim.
    DOUBLE DIAMONDS DEPEND ON A PROMOTION WE DO NOT CONTROL. The supplier
    delivers only the first number (55/165/275/565); the matching bonus is
    Moonton's FIRST-RECHARGE promotion, granted in-game on the first purchase
    of that pack tier. A customer who has already used their double on that
    tier receives only the paid half, and getrole does not report promo
    eligibility, so we cannot detect it or warn them personally.
    The condition is now stated in all three places a customer decides: the
    section blurb, a line under the bonus badge on every card, and a notice in
    the checkout summary above the pay button. Do not remove them.
  - |
    RESOLVED 2026-08-16 — kept because the wrong conclusion is easy to redraw.
    "SmileOne sandbox host does not exist" was correct but not the whole story:
    frontsmie.smile.one has no DNS record and there appears to be no sandbox at
    all. The production host https://www.smile.one works with the owner's live
    credentials and answered productlist with HTTP 200. The cost of there being
    no sandbox is that every future SmileOne test runs against real money —
    hence the delivery gate in lib/services/smileone/safety.ts.
  - |
    PAYFAST: TWO THINGS ARE GUESSED AND MUST BE CONFIRMED BEFORE REAL MONEY.
    The integration is built and the confirmed half (token exchange,
    transaction lookup, verification) is solid. Unconfirmed:
      1. The API hosts in lib/services/payfast/client.ts. Never dialled.
         Override with PAYFAST_API_BASE_URL rather than editing code.
      2. Every hosted-checkout field name in
         lib/services/payfast/hosted-checkout.ts. A draft, quarantined in one
         function. In production the app REFUSES to build a redirect until
         PAYFAST_FIELDS_CONFIRMED=1, which is the human act of having checked
         them against PayFast's own docs.
    A wrong guess in either is survivable: the gateway rejects the request and
    the customer never reaches a payment page. Neither can cause an unpaid
    order to be treated as paid — that path goes through verification, which
    trusts only our own basket id and PayFast's direct answer.
    ACTION: get the hosted-checkout guide + sandbox credentials from PayFast.
  - |
    NOTE — context7 has NO PayFast Pakistan documentation. Searching returns
    PayFast SOUTH AFRICA (payfast.co.za), a completely different company with
    an unrelated API. Code written from those docs will look correct and fail.
    Ours is gopayfast.com. Do not "fix" this integration against SA docs.
