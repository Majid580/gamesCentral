  - "The admin login `?from=` redirect is already guarded against open redirect (startsWith('/admin') + explicit '//' rejection). Checked 2026-08-18; recorded so it is not re-derived."
  - "The pre-paint theme script triggers a React dev-only console warning about script tags in a component tree. Intentional: next/script's beforeInteractive replays inline code after the framework chunks and would reintroduce a theme flash. Do not 'fix' it — see the comment in app/layout.tsx."
  - |
    RESOLVED 2026-09-04 — SCROLL REVEAL FIRES. Verified in the running app, not
    inferred: after scrolling, 17 of 40 [data-reveal] elements had opacity 1
    and transform none, and every element intersecting the viewport was
    revealed. The earlier note claimed IntersectionObserver "does not report
    intersections in a hidden document" — that is wrong, and the wrong half is
    worth keeping visible so it is not re-derived. IO delivery does not depend
    on the page painting.
  - |
    RESOLVED 2026-09-04 as far as anything headless can — POINTER TILT IS
    WIRED CORRECTLY, END TO END. A synthetic hover at 80% across and 20% down
    the first card produced exactly --px: 80.33%, --py: 17.90%,
    --tilt-x: 3.85deg, --tilt-y: 3.64deg, and the element's computed transform
    reaches a genuine 3D rotation matrix. The delegated pointermove handler,
    the rAF batching and the rect arithmetic all work.
    WHAT IS STILL UNOBSERVED IS THE MOTION ITSELF, and now for a measured
    reason rather than a guessed one: with the Browser pane hidden the tab
    produces ZERO frames — 0 rAF callbacks in 10.3 seconds of wall clock,
    an effective 0 fps. CSS transitions advance on the animation clock, so they
    only move when an input action forces a frame; a 450ms transition can sit
    unfinished for ten seconds. That also explains the screenshot timeouts and
    why `scrollTop = n` appears to do nothing while `scrollTo({behavior:
    "instant"})` works.
    So: correctness is verifiable headlessly and was verified. SMOOTHNESS AND
    TIMING ARE NOT, and never will be from this side — judging those needs the
    pane open in front of a person. Do not re-open this as a code defect.
  - |
    RESOLVED — kept as a note because the failure mode is easy to reintroduce.
    A CSS transition captures the computed colour and does not re-run when the
    custom property behind it changes, so any element carrying
    `transition-colors` could keep painting the previous theme's colour after a
    switch (measured: 2.49:1 on the storefront's Select label). Fixed globally:
    ThemeToggle adds `.theme-switching`, which suppresses transitions for the
    single frame of the swap. New components need no special handling — but do
    not remove that class, and do not set the theme attribute from anywhere
    else without it.
  - |
    A DELIVERY WHOSE OUTCOME IS UNKNOWN IS NOT A BUG — IT IS THE DESIGN.
    Order.fulfilmentInFlight is set before a createorder request and cleared
    with the delivery record. A run that finds it set refuses to continue and
    the admin screen WITHHOLDS the retry button, because between the request
    landing at SmileOne and our write there is a window where the diamonds are
    gone and nothing on our side knows. Retrying blind buys the pack twice;
    assuming success shorts the customer. Only the SmileOne dashboard knows.
    Do not "fix" this by adding an automatic retry or by clearing the marker on
    a timeout — timeouts are exactly the case it exists for.
  - |
    ONLY TWO FAILURES PROVE NOTHING WAS DELIVERED: a safety-gate refusal (never
    dispatched) and an upstream application-level status in an HTTP 200 body
    (a structured supplier "no" — insufficient balance lands here). Those clear
    the in-flight marker. Everything else — timeout, dropped connection, HTTP
    500, unparseable 200 — keeps it, because each can happen AFTER a successful
    delivery. See provesNothingWasDelivered() in lib/services/fulfilment.ts.
  - |
    The fulfilment sweeper deliberately does NOT retry paid_pending_fulfillment.
    An order is there because something went wrong, the reason is usually still
    true, and an automatic loop would send the same doomed call every five
    minutes. A person presses the button in admin. Do not "improve" this.
  - |
    Order.contactPhoneNormalised is REQUIRED for guest lookup by phone and is
    written only by createPendingOrder. Orders created by hand (fixtures,
    scripts, an admin tool later) must set it via normalisePkPhone() or the
    customer will not be able to find their own order by phone number. Email
    lookup is unaffected. Index synced 2026-08-18.
  - |
    EMAIL IS LIVE IN LOCAL DEV as of 2026-08-18 — Gmail SMTP via an app
    password, verified end to end: all four templates delivered, a real order
    through /api/checkout/create-order sent its receipt, and a half-failed paid
