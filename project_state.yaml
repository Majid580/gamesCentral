known_issues:
  - "CSP in next.config.ts uses 'unsafe-inline' for script-src to keep marketing pages statically rendered. Tighten to nonce + strict-dynamic on dynamic routes in Phase 9. See node_modules/next/dist/docs/**/content-security-policy.md. NOTE: the pre-paint theme script in app/layout.tsx needs that nonce when this lands."
  - "The pre-paint theme script triggers a React dev-only console warning about script tags in a component tree. Intentional: next/script's beforeInteractive replays inline code after the framework chunks and would reintroduce a theme flash. Do not 'fix' it — see the comment in app/layout.tsx."
  - "Scroll reveal was never observed firing: the Browser pane stayed hidden all session, and IntersectionObserver does not report intersections in a hidden document. Wiring verified, animation unwatched. Confirm visually in a real browser."
  - "Home page renders lib/placeholder-catalogue.ts behind a visible 'preview build' notice. Prices are illustrative and MUST NOT ship publicly — Phase 3 deletes that module."
  - "components/brand/logo.tsx is an SVG placeholder pending the owner's real logo files."
  - |
    ATLAS CREDENTIALS ARE root/root — GO-LIVE BLOCKER, NOT A DEV BLOCKER.
    Works fine for building, but this database will hold real orders and
    customer contact details. Before launch: strong generated password, a
    least-privilege user scoped readWrite on `gamescentral` only (not an
    admin/root user), and confirm Network Access is not left at 0.0.0.0/0.
  - |
    Node cannot perform SRV lookups on this Windows dev machine: DNS is
    DHCP-assigned (DhcpNameServer), Node's bundled c-ares only reads the static
    NameServer registry value, finds none, and falls back to 127.0.0.1 where
    nothing listens. dns.lookup still works, so only mongodb+srv:// breaks —
    it fails as `querySrv ECONNREFUSED`, which looks like a dead cluster.
    Worked around by ensureSrvResolverAvailable() in lib/utils/dns-resolver.ts,
    which fires only when no usable nameserver exists. Permanent fix is to set
    a static DNS server on the adapter. Not an issue on the Linux production
    target.
  - "Legal pages are substantive drafts carrying visible 'Draft — needs owner review' banners and inline TODO(owner) markers. Section 21 gates go-live on these being resolved."

blockers:
  - |
    SMILEONE SANDBOX HOST DOES NOT EXIST. The base URL given in the brief,
    https://frontsmie.smile.one, has NO DNS record. Verified 2026-08-15:
    frontsmie / sandbox / test / api / dev .smile.one all return
    "DNS name does not exist", while www.smile.one and smile.one resolve
    normally and general outbound network access is confirmed working
    (registry.npmjs.org returned 200). So this is not a local network problem —
    the sandbox hostname is wrong or decommissioned.
    ACTION: owner must confirm the correct sandbox base URL from
    mlbb_API_Documentation.pdf (authoritative per the brief) or from their
    SmileOne account manager. Until then, productlist/getrole cannot be
    verified live and the response schemas in lib/services/smileone/client.ts
    remain unconfirmed guesses.
  - "PayFast: no merchant sandbox credentials yet, and hosted-checkout field-level docs still needed from the PayFast dashboard/account manager. Phase 5 cannot start without both."
  - "Hostinger plan type (VPS vs Node.js shared hosting) unknown — determines the Phase 11 deploy method. Not blocking until Phase 11."
  - "Brand assets: owner has dark/light logos as JPG. Need PNG/SVG with transparency before final polish. Not a launch blocker."

