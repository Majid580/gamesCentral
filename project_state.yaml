  - |
    Node cannot perform SRV lookups on this Windows dev machine: DNS is
    DHCP-assigned (DhcpNameServer), Node's bundled c-ares only reads the static
    NameServer registry value, finds none, and falls back to 127.0.0.1 where
    nothing listens. dns.lookup still works, so only mongodb+srv:// breaks —
    it fails as `querySrv ECONNREFUSED`, which looks like a dead cluster.
    Worked around by resolveMongoUri() in lib/utils/dns-resolver.ts, which
    probes the default resolver and, only when it cannot do SRV, looks the
    record up on a private Resolver and rewrites the URI to its non-SRV
    equivalent (appending tls=true, which mongodb+srv implies and mongodb://
    does not). An earlier dns.setServers() approach was REPLACED because it
    only works if it runs before anything else in the process touches DNS —
    true in a script, false in the Next.js server. Permanent fix is to set
    a static DNS server on the adapter. Not an issue on the Linux production
    target.
