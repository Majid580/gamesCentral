decisions:
  pricing: |
    Prices are OWNER-SET FINAL RETAIL PKR, not computed (owner, 2026-08-15).
    Catalogue.xlsx gives rupee prices that already include the owner's margin,
    so Product.pricePkr is authoritative and no exchange-rate/markup maths runs
    on it. The formula stays in AppConfig for any future supplier-rate-priced
    product. Rule 1 is unaffected: price still comes from our DB server-side
    and is never accepted from the client.
  architecture: "Single Next.js app (confirmed by owner) — no separate Express service."
  admin_auth: "Auth.js / NextAuth (confirmed by owner)."
  customer_accounts: "None in v1 — guest checkout + order lookup by order ID + email/phone (confirmed by owner)."
  hosting: "Vercel for preview/testing only; production on Hostinger (owner decision, 2026-08-15). No Vercel-only primitives anywhere in the codebase."
  payfast_mode: "Hosted/redirect checkout recommended to stay out of PCI-DSS scope. NOT yet confirmed with owner against live merchant dashboard."

