known_issues:
  - |
    ⛔ LIVE SMILEONE ACCOUNT — NOT A DEV SANDBOX. There is no sandbox; the only
    working host is production. Every request is against the owner's real
    account holding real purchased diamonds, and a delivery is irreversible.
    Permitted: productlist, getrole (both read-only, spend nothing).
    Forbidden: createorder or anything else that delivers — no test deliveries,
    not even the cheapest pack, not with the owner's own player ID.
    Enforced by lib/services/smileone/safety.ts. Do not remove that gate and do
    not set SMILEONE_ALLOW_FULFILMENT. Full rules in LIVE_ACCOUNT_SAFETY.md.
  - |
    /api/checkout/verify-account IS UNRATE-LIMITED AND PROXIES THE SUPPLIER.
    Every call hits the owner's real SmileOne account. It cannot spend money —
    getrole only reads — but an unthrottled public endpoint fronting a partner
    API invites the supplier to throttle or suspend the merchant account, which
    would take the whole storefront down. The MongoDB TTL rate-limit pattern
    from admin login (lib/models/login-attempt.ts) applies directly. Do this
    before go-live, not in Phase 9 cleanup.
  - |
    getrole's `zone` is NOT the Zone ID that was sent — a lookup on zone 16932
    returned `zone: 1`. Meaning unknown. The checkout UI shows the customer's
    typed Zone ID, not this, and it must stay that way. Do not "fix" the UI to
    display role.zone.
  - |
    getrole returns an undocumented `id_change_price_info`: a per-product
    [{product_id, change_price}] array (observed: all 1 except product 25 at
    1.0043 — they read as multipliers, not prices). Phase 6 needs to decide
    how this interacts with the top-level change_price before computing any
    final charge. It also listed product_id 20340, which is NOT in the
    productlist response — another sign the catalogue mapping is not settled.
  - "CSP in next.config.ts uses 'unsafe-inline' for script-src to keep marketing pages statically rendered. Tighten to nonce + strict-dynamic on dynamic routes in Phase 9. See node_modules/next/dist/docs/**/content-security-policy.md. NOTE: the pre-paint theme script in app/layout.tsx needs that nonce when this lands."
  - "The pre-paint theme script triggers a React dev-only console warning about script tags in a component tree. Intentional: next/script's beforeInteractive replays inline code after the framework chunks and would reintroduce a theme flash. Do not 'fix' it — see the comment in app/layout.tsx."
  - "Scroll reveal was never observed firing: the Browser pane stayed hidden all session, and IntersectionObserver does not report intersections in a hidden document. Wiring verified, animation unwatched. Confirm visually in a real browser."
  - |
    Pointer tilt / specular on the product cards has never been observed. The
    Browser pane stayed hidden all session, so the page never composites,
    requestAnimationFrame never fires, and screenshots time out. Same root
    cause as the unobserved scroll reveal. CSS computes correctly (slab shadow
    and 3D matrix both read back) but the motion is unwatched. Confirm in a
    real browser.
  - |
    RESOLVED — kept as a note because the failure mode is easy to reintroduce.
    A CSS transition captures the computed colour and does not re-run when the
    custom property behind it changes, so any element carrying
    `transition-colors` could keep painting the previous theme's colour after a
    switch (measured: 2.49:1 on the storefront's Select label). Fixed globally:
    ThemeToggle adds `.theme-switching`, which suppresses transitions for the
    single frame of the swap. New components need no special handling — but do
    not remove that class, and do not set the theme attribute from anywhere
    else without it.
  - "components/brand/logo.tsx is an SVG placeholder pending the owner's real logo files."
  - |
    Admin catalogue/price editing is NOT built. Prices are owner-set and change
    through lib/catalogue-source.ts + `npm run db:seed`, which is reviewable as
    a diff. A price editor edits live money and deserves its own pass.
  - |
    Adding a Mongoose model is TWO steps: create it, and add it to the model
    list in scripts/db-sync-indexes.mts. LoginAttempt's TTL index silently did
    not exist until the second step was done.
  - |
    RESTART THE DEV SERVER AFTER CHANGING A SCHEMA. defineModel() reuses the
    model already registered on the mongoose singleton, and that cached model
    keeps its ORIGINAL schema across a hot reload. Mongoose strips fields it
    does not know about, so writes succeed while silently dropping the new
    field — no error anywhere. Cost an order that saved without its
    fulfilmentPlan before the cause was found.
  - |
    Four test orders exist in the orders collection from verifying the
    fulfilment snapshot: GC-CBV6X-SFRW4 (written by the stale model, so it has
    NO fulfilmentPlan — it is the bug, not a valid record), GC-PN669-J3JU9,
    GC-PZKCD-W7MFB and GC-J8GD2-JPRU8. All are status `pending`, unpaid,
    contact owner-test@gamescentral.pk. Safe to delete whenever the owner
    wants; left in place because deleting order records is their call.
  - |
    ATLAS CREDENTIALS ARE root/root — GO-LIVE BLOCKER, NOT A DEV BLOCKER.
    Works fine for building, but this database will hold real orders and
    customer contact details. Before launch: strong generated password, a
    least-privilege user scoped readWrite on `gamescentral` only (not an
    admin/root user), and confirm Network Access is not left at 0.0.0.0/0.
  - |
    Node cannot perform SRV lookups on this Windows dev machine: DNS is
    DHCP-assigned (DhcpNameServer), Node's bundled c-ares only reads the static
    NameServer registry value, finds none, and falls back to 127.0.0.1 where
    nothing listens. dns.lookup still works, so only mongodb+srv:// breaks —
    it fails as `querySrv ECONNREFUSED`, which looks like a dead cluster.
    Worked around by resolveMongoUri() in lib/utils/dns-resolver.ts, which
    probes the default resolver and, only when it cannot do SRV, looks the
    record up on a private Resolver and rewrites the URI to its non-SRV
    equivalent (appending tls=true, which mongodb+srv implies and mongodb://
    does not). An earlier dns.setServers() approach was REPLACED because it
    only works if it runs before anything else in the process touches DNS —
    true in a script, false in the Next.js server. Permanent fix is to set
    a static DNS server on the adapter. Not an issue on the Linux production
    target.
  - "Legal pages are substantive drafts carrying visible 'Draft — needs owner review' banners and inline TODO(owner) markers. Section 21 gates go-live on these being resolved."

blockers:
  - |
    RESOLVED 2026-08-16 — kept because the reasoning is not re-derivable from
    the code alone. The catalogue/supplier gap was composition, not missing
    stock: "344 Diamonds" is 2× 172, "600" is 86 + 2× 257. All 26 SKUs now map
    (npm run catalogue:verify).
    The mapping was cross-checked against the owner's OWN PRICES, which turn
    out to be set at a near-constant ~60 PKR per BRL of supplier cost across
    the whole catalogue (86 dia: 380/6.25 = 60.8; 9288: 37700/625 = 60.3).
    That rate identifies which pack a product was priced from — it is what
    confirmed the two combos use the 165 and 55 packs (1,150 PKR ≈ 19.99 BRL)
    and the Double Diamonds use the flat 55/165/275/565 packs. If a future
    price looks wrong, this rate is the check.
  - |
    DOUBLE DIAMONDS DEPEND ON A PROMOTION WE DO NOT CONTROL. The supplier
    delivers only the first number (55/165/275/565); the matching bonus is
    Moonton's FIRST-RECHARGE promotion, granted in-game on the first purchase
    of that pack tier. The storefront states "pay for 55 diamonds and receive
    110 in total" as fact. A customer who has already used their double on
    that tier will receive 55 and believe they were short-changed, and we
    cannot detect it beforehand — getrole does not report promo eligibility.
    Consider wording that names the condition before go-live. Pre-existing
    (the old 50+50 naming made the same claim), not introduced by the mapping.
  - |
    RESOLVED 2026-08-16 — kept because the wrong conclusion is easy to redraw.
    "SmileOne sandbox host does not exist" was correct but not the whole story:
    frontsmie.smile.one has no DNS record and there appears to be no sandbox at
    all. The production host https://www.smile.one works with the owner's live
    credentials and answered productlist with HTTP 200. The cost of there being
    no sandbox is that every future SmileOne test runs against real money —
    hence the delivery gate in lib/services/smileone/safety.ts.
  - "PayFast: no merchant sandbox credentials yet, and hosted-checkout field-level docs still needed from the PayFast dashboard/account manager. Phase 5 cannot start without both."
  - "Hostinger plan type (VPS vs Node.js shared hosting) unknown — determines the Phase 11 deploy method. Not blocking until Phase 11."
  - "Brand assets: owner has dark/light logos as JPG. Need PNG/SVG with transparency before final polish. Not a launch blocker."

