    PASSWORD with 2-Step Verification on; it rejects the account password
    outright. Re-check any environment with `npm run email:preview -- --send`,
    which mails only ADMIN_EMAIL.
  - |
    Email templates are built by STRING CONCATENATION and interpolate
    customer-controlled values (an in-game username chosen by a stranger).
    React is not involved, so nothing escapes automatically — every
    interpolation must go through `esc()` in templates.ts. `npm run
    email:preview` fails the build-style check if a username reaches the HTML
    unescaped; keep that assertion.
  - "components/brand/logo.tsx is an SVG placeholder pending the owner's real logo files."
  - |
    Admin catalogue/price editing is NOT built. Prices are owner-set and change
    through lib/catalogue-source.ts + `npm run db:seed`, which is reviewable as
    a diff. A price editor edits live money and deserves its own pass.
  - |
    Adding a Mongoose model is TWO steps: create it, and add it to the model
    list in scripts/db-sync-indexes.mts. LoginAttempt's TTL index silently did
    not exist until the second step was done.
  - |
    RESTART THE DEV SERVER AFTER CHANGING A SCHEMA. defineModel() reuses the
    model already registered on the mongoose singleton, and that cached model
    keeps its ORIGINAL schema across a hot reload. Mongoose strips fields it
    does not know about, so writes succeed while silently dropping the new
    field — no error anywhere. Cost an order that saved without its
    fulfilmentPlan before the cause was found.
  - |
    Four test orders exist in the orders collection from verifying the
    fulfilment snapshot: GC-CBV6X-SFRW4 (written by the stale model, so it has
    NO fulfilmentPlan — it is the bug, not a valid record), GC-PN669-J3JU9,
    GC-PZKCD-W7MFB and GC-J8GD2-JPRU8. All are status `pending`, unpaid,
    contact owner-test@gamescentral.pk. Safe to delete whenever the owner
    wants; left in place because deleting order records is their call.
    The 2026-08-18 fulfilment/track testing created further fixtures and
    deleted every one of them by id afterwards — those left nothing behind.
  - |
    ATLAS CREDENTIALS ARE root/root — GO-LIVE BLOCKER, NOT A DEV BLOCKER.
    Works fine for building, but this database will hold real orders and
    customer contact details. Before launch: strong generated password, a
    least-privilege user scoped readWrite on `gamescentral` only (not an
    admin/root user), and confirm Network Access is not left at 0.0.0.0/0.
  - |
    Node cannot perform SRV lookups on this Windows dev machine: DNS is
    DHCP-assigned (DhcpNameServer), Node's bundled c-ares only reads the static
    NameServer registry value, finds none, and falls back to 127.0.0.1 where
    nothing listens. dns.lookup still works, so only mongodb+srv:// breaks —
    it fails as `querySrv ECONNREFUSED`, which looks like a dead cluster.
    Worked around by resolveMongoUri() in lib/utils/dns-resolver.ts, which
    probes the default resolver and, only when it cannot do SRV, looks the
    record up on a private Resolver and rewrites the URI to its non-SRV
    equivalent (appending tls=true, which mongodb+srv implies and mongodb://
    does not). An earlier dns.setServers() approach was REPLACED because it
    only works if it runs before anything else in the process touches DNS —
    true in a script, false in the Next.js server. Permanent fix is to set
    a static DNS server on the adapter. Not an issue on the Linux production
    target.
  - |
    RESOLVED 2026-08-16 — business details and legal pages are live-ready. The
